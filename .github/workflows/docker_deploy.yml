name: docker_deploy

on:
  push:
    branches:
      - EK-61-GitHub-Actions-workflows

jobs:
  build-image-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run:  |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ecopin-backend:latest .

      - name: Push image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ecopin-backend:latest

      - name: Notify server via webhook
        uses: distributhor/workflow-webhook@v3
        with: 
          url: ${{ secrets.WEBHOOK_URL }}
          method: POST
          body: '{"status": "new version pushed"}'
          headers: '{"Content-Type":"application/json", "Authorization": "Bearer ${{ secrets.WEBHOOK_TOKEN }}"}' 
