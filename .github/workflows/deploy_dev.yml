name: deploy_dev

on:
  push:
    branches:
      - dev

jobs:
  build-image-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build images
        run:  |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ecopin-backend:dev ./spletno/backend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ecopin-frontend:dev ./spletno/frontend

      - name: Push images to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ecopin-backend:dev
          docker push ${{ secrets.DOCKER_USERNAME }}/ecopin-frontend:dev

      - name: Notify server via webhook
        uses: distributhor/workflow-webhook@v3
        with: 
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          data: '{"status": "new version pushed"}'
          webhook_auth_type: "bearer"
          webhook_auth: "${{ secrets.WEBHOOK_TOKEN }}" 
